<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-label="sun weather icon">
  <defs>
    <filter id="shadow" filterUnits="userSpaceOnUse" x="0" y="0" width="256" height="256">
      <feDropShadow dx="0" dy="3" stdDeviation="2.6" flood-color="#173949" flood-opacity=".25"/>
    </filter>
    <radialGradient id="sun" cx="32%" cy="24%" r="83%">
      <stop stop-color="#FFF0A4"/>
      <stop offset=".50" stop-color="#FFDA74"/>
      <stop offset=".84" stop-color="#FFC04F"/>
      <stop offset="1" stop-color="#F4A335"/>
    </radialGradient>
  </defs>
  <g filter="url(#shadow)">
    <circle cx="128" cy="125" r="91" fill="url(#sun)" stroke="#DC9B38" stroke-opacity=".48" stroke-width="2"/>
  </g>
</svg>
